%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/ti,twl6030-usb.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Texas Instruments TWL6030 USB Comparator

maintainers:
  - Peter Ujfalusi <peter.ujfalusi@gmail.com>

description:
  Bindings for the USB comparator module found within the TWL6030
  family of companion chips.

properties:
  compatible:
    const: ti,twl6030-usb

  interrupts:
    items:
      - description: OTG for ID events in host mode
      - description: USB device mode for VBUS events

  usb-supply:
    description:
      Phandle to the VUSB regulator. For TWL6030, this should be the 'vusb'
      regulator. For TWL6032 subclass, it should be the 'ldousb' regulator.

  syscon-chgdet:
    description:
      For USB charger detection by an OMAP4 USB2 PHY, the control module
      syscon and the offset of CONTROL_USB2PHYCORE in it.
    $ref: /schemas/types.yaml#/definitions/phandle-array
    items:
      - items:
          - description: phandle to the control module syscon
          - description: offset of CONTROL_USB2PHYCORE

  phys:
    maxItems: 1
    description: The USB2 PHY, for charger detection.

  phy-names:
    const: usb2-phy

required:
  - compatible
  - interrupts
  - usb-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>

    usb {
        compatible = "ti,twl6030-usb";

        interrupts = <4 IRQ_TYPE_LEVEL_HIGH>, <10 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-parent = <&gic>;

        usb-supply = <&reg_vusb>;
    };
